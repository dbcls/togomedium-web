packages:
  - "@packages/*"
overrides:
  # Scalar's Vue components must share one runtime across transitive dependencies.
  vue: "3.5.40"
packageExtensions:
  # These packages import dependencies that are only declared as devDependencies.
  "vue-sonner@1.3.2":
    dependencies:
      vue: "^3.5.26"
  "@scalar/schemas@0.10.0":
    dependencies:
      "@scalar/types": "0.20.0"
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  vue-demi: false
