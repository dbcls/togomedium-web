packages:
  - "@packages/*"
overrides:
  # Scalar's Vue components must share one runtime across transitive dependencies.
  vue: "3.5.40"
packageExtensions:
  # vue-sonner 1.3 imports Vue but only declares it as a devDependency.
  "vue-sonner@1.3.0":
    dependencies:
      vue: "^3.5.26"
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  vue-demi: false
